name: Traffic stats

# GitHub only keeps 14 days of traffic data; this job snapshots it daily into
# traffic/ so history accumulates. Missing days within the window are backfilled
# by the next successful run.

on:
  schedule:
    - cron: "17 22 * * *" # daily 22:17 UTC = 06:17 next day Beijing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect traffic
        env:
          # Traffic endpoints need push access. github.token normally works;
          # if it ever returns 403, create a classic PAT with `repo` scope and
          # store it as the Actions secret TRAFFIC_TOKEN.
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: python3 .github/scripts/collect_traffic.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if git diff --cached --quiet; then
            echo "No traffic changes today"
            exit 0
          fi
          git commit -m "traffic: daily stats $(date -u +%F)"
          git push origin HEAD:${{ github.ref_name }} ||
            (git pull --rebase --autostash origin ${{ github.ref_name }} &&
             git push origin HEAD:${{ github.ref_name }})
